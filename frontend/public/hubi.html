<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hubi</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="400" height="240"></canvas>
    <script src="hubi/eyes.js"></script>
    <script src="hubi/app.js"></script>
  </body>
</html>
